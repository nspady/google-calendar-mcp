version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Security fixes for production deps land as one PR
      production-security:
        applies-to: security-updates
        dependency-type: production
      # Routine minor/patch bumps grouped to keep PR noise low;
      # majors (googleapis, vitest, typescript) arrive as individual PRs
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
      development-minor:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
