# Google Calendar MCP Server - Docker Compose Configuration
# Simple, production-ready setup following Docker best practices

services:
  calendar-mcp:
    build: .
    container_name: calendar-mcp
    restart: unless-stopped
    
    # Environment configuration via .env file
    env_file: .env

    # OAuth credentials and token storage
    volumes:
      - ./gcp-oauth.keys.json:/app/gcp-oauth.keys.json:ro
      - calendar-tokens:/home/nodejs/.config/google-calendar-mcp
    
    # Expose ports for HTTP mode and OAuth authentication
    ports:
      - "3000:3000"  # HTTP mode MCP server
      - "3500:3500"  # OAuth authentication
      - "3501:3501"
      - "3502:3502"
      - "3503:3503"
      - "3504:3504"
      - "3505:3505"
    
    
    # Resource limits for production stability
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Health check for HTTP mode (safe for stdio mode too)
    healthcheck:
      test: ["CMD", "node", "-e", "if (process.env.TRANSPORT && process.env.TRANSPORT !== 'http') process.exit(0); fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      default:
      litellm_shared:
        aliases:
          - integrahub-calendar-mcp
          - calendar-mcp

# Persistent volume for OAuth tokens
volumes:
  calendar-tokens:
    driver: local

networks:
  litellm_shared:
    external: true
    name: litellm_litellm_network
